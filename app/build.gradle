plugins {
    id 'com.android.application'
}

// Release signing is intentionally supplied from environment variables.
// Never commit the production keystore or its passwords to this repository.
def releaseStoreFile = System.getenv("RELEASE_STORE_FILE")
def releaseStorePassword = System.getenv("RELEASE_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("RELEASE_KEY_ALIAS")
def releaseKeyPassword = System.getenv("RELEASE_KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.example.callblocker'
    compileSdk 35

    defaultConfig {
        applicationId "ir.imohsen.callblocker"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        debug {
            // Keep development builds separate from the public/store package.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }

        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            // Keep the first public release conservative and easy to diagnose.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
